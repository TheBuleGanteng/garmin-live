# Local prod-mimic stack: the app under BASE_PATH=/garmin-mcp behind nginx, plus a replay
# server that fakes LiveTrack at 20x for end-to-end tests.
#
#   docker compose -f docker/docker-compose.local.yml up --build -d
#   curl -s http://localhost:8080/garmin-mcp/health
#   .venv/bin/python tools/mcp_smoke.py --url http://localhost:8080/garmin-mcp/mcp/$MCP_PATH_SECRET
#
# MCP_PATH_SECRET must be set in the environment (a test value is fine, e.g. the one in
# tests/e2e). Nothing here is used in production.
services:
  garmin-live:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: garmin-live:local
    environment:
      BASE_PATH: /garmin-mcp
      MCP_PATH_SECRET: ${MCP_PATH_SECRET:?set MCP_PATH_SECRET (>=32 chars) for the local stack}
      DB_PATH: /data/garmin.db
      RETENTION_DAYS: "30"
      FETCH_STRATEGY: http
      POLL_MIN_SECONDS: "5"
      MAX_SESSION_HOURS: "12"
      ENFORCE_IP_ALLOWLIST: "false"
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1
      ATHLETE_MAX_HR: "${ATHLETE_MAX_HR:-185}"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - garmin-live-local-data:/data
    mem_limit: 256m
    restart: "no"

  replay:
    image: garmin-live:local
    command: ["python", "-m", "garmin_live.replay.server", "run1", "8765", "${REPLAY_SPEED:-20}", "0.0.0.0"]
    environment:
      MCP_PATH_SECRET: ${MCP_PATH_SECRET:?set MCP_PATH_SECRET}
    expose:
      - "8765"
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${LOCAL_NGINX_PORT:-8080}:8080"
    volumes:
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/garmin-mcp.location.conf:/etc/nginx/conf.d/garmin-mcp.location.conf:ro
    depends_on:
      - garmin-live

volumes:
  garmin-live-local-data:
