# Local prod-mimic nginx: terminates on :8080 and includes the SAME location block used in prod.
events {}
http {
    # The compose service name `garmin-live` is resolved through Docker's DNS at startup
    # (nginx depends_on the app). No `upstream` block: the canonical location block uses
    # proxy_pass with an explicit port, which nginx forbids together with a named upstream.
    server {
        listen 8080;
        server_name localhost;
        # Everything not under /garmin-mcp/ should 404, exactly like a real shared host would
        # for unknown paths.
        location / { return 404; }
        include /etc/nginx/conf.d/garmin-mcp.location.conf;
    }
}
