# Canonical nginx block for serving garmin-live under the /garmin-mcp prefix.
# Include this inside your `server { ... }` block. The upstream name `garmin-live` is the
# compose service name; the app serves natively under BASE_PATH=/garmin-mcp, so proxy_pass has
# NO URI part (the full path is passed through unchanged).
location = /garmin-mcp { return 301 /garmin-mcp/; }
location /garmin-mcp/ {
    proxy_pass http://garmin-live:8000;      # no URI part: full path passed through (app serves under the prefix)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;  # PROVISION adjusts if the VM derives client IP from CF-Connecting-IP
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;                      # streamable HTTP / SSE
    proxy_cache off;
    proxy_read_timeout 3600s;
}
