# gitleaks configuration for garmin-live.
# Extends the default ruleset shipped with the pinned gitleaks image
# (zricethezav/gitleaks:v8.21.2) and adds project-specific rules.

title = "garmin-live gitleaks config"

[extend]
useDefault = true

# Private IPv4 addresses of hosts (the VM) must never be committed.
# The denylist hook (tools/check_denylist.sh) is the primary guard for the exact
# value; this rule is a second net for any public-looking IPv4 literal that
# is not an obvious documentation/loopback address.
[[rules]]
id = "garmin-live-ipv4-literal"
description = "Public IPv4 literal (possible host/VM address)"
regex = '''\b(?:(?:[1-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.)(?:(?:[0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){2}(?:[0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\b'''
keywords = ["."]
[rules.allowlist]
regexes = [
  '''\b127\.0\.0\.1\b''',
  '''\b0\.0\.0\.0\b''',
  '''\b10\.(?:[0-9]{1,3}\.){2}[0-9]{1,3}\b''',
  '''\b192\.168\.[0-9]{1,3}\.[0-9]{1,3}\b''',
  '''\b172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}\b''',
  '''\b203\.0\.113\.[0-9]{1,3}\b''',
  '''\b198\.51\.100\.[0-9]{1,3}\b''',
  '''\b192\.0\.2\.[0-9]{1,3}\b''',
  '''\b255\.255\.255\.[0-9]{1,3}\b''',
  '''\b(?:[0-9]+\.){3}[0-9]+\.[0-9]+''',
]

# A LiveTrack session token or the MCP path secret pasted into code.
[[rules]]
id = "garmin-live-mcp-path-secret"
description = "MCP_PATH_SECRET assigned a non-placeholder value"
regex = '''MCP_PATH_SECRET\s*[=:]\s*["']?([A-Za-z0-9_\-]{32,})["']?'''
secretGroup = 1
keywords = ["MCP_PATH_SECRET"]

[allowlist]
description = "Obviously fake test secrets and documentation placeholders"
regexes = [
  '''test-secret-not-real-[0-9a-z\-]+''',
  '''replace-me-with-[a-z0-9\-]+''',
  '''<[A-Z_]+>''',
  '''CHANGE_ME[A-Z0-9_]*''',
  '''FAKE_[A-Z0-9_]+''',
]
paths = [
  '''(^|/)\.venv/''',
  '''(^|/)fixtures/raw/''',
  '''(^|/)CLAUDE_SUMMARY\.md$''',
]
